<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latihan HOTS: Garis Singgung Lingkaran</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1d2433;--mute:#5d6678;--line:#e0dccf;--acc:#1f5e5b;--acc2:#b4572b;--hint:#fdf3dc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a22;--card:#1c2430;--ink:#e8ecf2;--mute:#9aa5b8;--line:#2d384a;--acc:#5fc1bb;--acc2:#e69a6f;--hint:#2c2a1e}}
:root[data-theme="dark"]{--bg:#141a22;--card:#1c2430;--ink:#e8ecf2;--mute:#9aa5b8;--line:#2d384a;--acc:#5fc1bb;--acc2:#e69a6f;--hint:#2c2a1e}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 Georgia,"Times New Roman",serif}
.wrap{max-width:820px;margin:0 auto;padding:28px 18px 60px}
header h1{font-size:1.9rem;line-height:1.2;margin:0 0 6px;color:var(--acc)}
header p{margin:0;color:var(--mute);font-family:system-ui,sans-serif;font-size:.95rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 0;margin-top:14px;border-bottom:1px solid var(--line);z-index:5;font-family:system-ui,sans-serif}
.prog{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:.9rem;color:var(--mute)}
button{font:600 .85rem system-ui,sans-serif;border:1px solid var(--acc);background:transparent;color:var(--acc);padding:6px 12px;border-radius:8px;cursor:pointer}
button:hover{background:var(--acc);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:10px;padding:18px 20px;margin:18px 0}
.card.done{border-left-color:var(--acc2);opacity:.8}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:system-ui,sans-serif;margin-bottom:6px}
.no{font-weight:700;color:var(--acc);font-size:.95rem}
.tag{font-size:.75rem;padding:2px 9px;border-radius:20px;background:var(--hint);color:var(--acc2);border:1px solid var(--line)}
.card p{margin:.5em 0}
.card ol{margin:.4em 0 .6em 1.2em;padding:0}
.hint{display:none;background:var(--hint);border-radius:8px;padding:10px 14px;margin-top:10px;font-size:.95rem}
.hint.show{display:block}
.act{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;font-family:system-ui,sans-serif;font-size:.88rem}
label{cursor:pointer;color:var(--mute)}
@media print{.bar,.act{display:none}.hint{display:block}.card{break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>Latihan HOTS: Garis Singgung Lingkaran</h1>
<p>Mata Kuliah Geometri Analitik · 10 soal berpikir tingkat tinggi (analisis, evaluasi, mencipta)</p>
</header>
<div class="bar">
<div class="prog"><i id="pb"></i></div>
<div class="row"><span id="pt">0 dari 10 soal selesai</span>
<button id="th">Tampilkan semua petunjuk</button>
<button id="rs">Atur ulang</button>
<button id="dk">Mode gelap/terang</button>
<button onclick="window.print()">Cetak</button></div>
</div>
<main id="list"></main>
</div>
<script>
const S=[
{t:"C4 · Menganalisis",q:"<p>Garis <b>y = 2x + k</b> menyinggung lingkaran <b>x² + y² = 20</b>.</p><ol><li>Tentukan semua nilai k.</li><li>Tentukan koordinat titik singgung untuk setiap nilai k.</li><li>Jelaskan secara geometris mengapa terdapat tepat dua nilai k.</li></ol>",h:"Syarat tangen: jarak pusat ke garis sama dengan jari-jari, atau diskriminan hasil substitusi sama dengan nol."},
{t:"C4 · Menganalisis",q:"<p>Titik <b>P(7, 1)</b> dan lingkaran <b>(x − 1)² + (y − 2)² = 25</b>.</p><ol><li>Tunjukkan bahwa P berada di luar lingkaran.</li><li>Tentukan persamaan kedua garis singgung dari P.</li><li>Hitung panjang ruas garis singgung dari P ke titik singgung.</li></ol>",h:"Gunakan garis y − 1 = m(x − 7) lalu syarat jarak pusat ke garis sama dengan r. Panjang singgung = √(kuasa titik P)."},
{t:"C6 · Mencipta",q:"<p>Sebuah lingkaran menyinggung garis <b>3x + 4y − 10 = 0</b> di titik <b>(2, 1)</b> dan pusatnya terletak pada garis <b>x − y − 3 = 0</b>.</p><p>Susunlah persamaan lingkaran tersebut, lalu periksa kebenarannya dengan dua cara berbeda.</p>",h:"Pusat terletak pada garis normal yang melalui titik singgung, yaitu searah vektor (3, 4)."},
{t:"C5 · Mengevaluasi",q:"<p>Lingkaran <b>x² + y² − 2x + 4y − 20 = 0</b>.</p><ol><li>Tentukan persamaan garis singgung yang tegak lurus garis <b>3x + 4y = 7</b>.</li><li>Seorang mahasiswa menyatakan hanya ada satu garis singgung seperti itu. Evaluasi pernyataan ini.</li></ol>",h:"Ubah ke bentuk baku dahulu. Gradien garis singgung yang dicari adalah negatif kebalikan gradien garis yang diberikan."},
{t:"C4 · Menganalisis",q:"<p>Dari titik <b>Q(6, 2)</b> ditarik dua garis singgung ke lingkaran <b>x² + y² = 20</b>, menyinggung di A dan B.</p><ol><li>Tentukan persamaan garis AB (garis kutub/polar).</li><li>Hitung panjang tali busur AB.</li><li>Tunjukkan bahwa garis AB tegak lurus garis OQ.</li></ol>",h:"Garis polar titik (x₁, y₁) terhadap x² + y² = r² adalah x₁x + y₁y = r². Panjang tali busur dari jarak O ke garis AB."},
{t:"C5 · Mengevaluasi",q:"<p>Dua lingkaran <b>x² + y² = 4</b> dan <b>(x − 6)² + y² = 4</b>.</p><ol><li>Berapa banyak garis singgung persekutuan yang ada? Jelaskan alasannya.</li><li>Tentukan persamaan semua garis singgung persekutuan luar dan dalam.</li><li>Jika jari-jari lingkaran kedua diubah menjadi 1, bagaimana perubahan banyak dan jenis garis singgungnya?</li></ol>",h:"Garis singgung persekutuan dalam melalui titik yang membagi garis pusat dengan perbandingan r₁ : r₂."},
{t:"C6 · Mencipta",q:"<p>Buktikan bahwa jika dua garis singgung dari titik P ke lingkaran <b>x² + y² = r²</b> saling tegak lurus, maka P terletak pada lingkaran <b>x² + y² = 2r²</b>.</p><p>Kemudian rumuskan dan buktikan generalisasinya untuk lingkaran berpusat di (a, b).</p>",h:"Pandang segiempat O, titik singgung A, P, titik singgung B. Atau gunakan hasil kali gradien kedua garis singgung sama dengan −1."},
{t:"C5 · Mengevaluasi",q:"<p>Jangkauan sebuah radar dimodelkan lingkaran <b>(x − 2)² + (y + 1)² = 16</b> (satuan km). Sebuah kapal bergerak lurus sepanjang garis <b>3x − 4y + c = 0</b>.</p><ol><li>Tentukan nilai c agar kapal tepat menyentuh batas jangkauan radar.</li><li>Untuk c = 0, apakah kapal memasuki jangkauan? Berapa panjang lintasan di dalam jangkauan?</li><li>Tentukan rentang c agar kapal aman, yaitu tidak pernah terdeteksi.</li></ol>",h:"Bandingkan jarak pusat ke garis dengan jari-jari. Panjang lintasan di dalam adalah tali busur: 2√(r² − d²)."},
{t:"C6 · Mencipta",q:"<p>Turunkan (buktikan) bahwa persamaan garis singgung lingkaran <b>(x − a)² + (y − b)² = r²</b> dengan gradien m adalah</p><p style=\"text-align:center\"><b>y − b = m(x − a) ± r√(1 + m²)</b></p><p>Selanjutnya, gunakan rumus ini untuk menentukan garis singgung lingkaran <b>x² + y² − 6x − 8y = 0</b> yang sejajar garis <b>y = x</b>.</p>",h:"Substitusikan y = mx + c ke persamaan lingkaran dan tetapkan diskriminan = 0, atau gunakan rumus jarak titik ke garis."},
{t:"C5 · Mengevaluasi",q:"<p>Titik P bergerak sepanjang garis <b>x + y = 8</b>. Dari P ditarik garis singgung ke lingkaran <b>x² + y² = 9</b>.</p><ol><li>Nyatakan panjang garis singgung sebagai fungsi koordinat P.</li><li>Tentukan posisi P agar panjang garis singgung minimum, beserta nilai minimumnya.</li><li>Berikan alasan geometris tanpa kalkulus mengapa posisi tersebut optimal.</li></ol>",h:"Panjang singgung² = x² + y² − 9. Minimumkan jarak P ke O pada garis tersebut."}
];
const L=document.getElementById('list'),pb=document.getElementById('pb'),pt=document.getElementById('pt');
let done={};
try{done=JSON.parse(localStorage.getItem('hotsgs')||'{}')}catch(e){}
S.forEach((s,i)=>{
 const c=document.createElement('section');c.className='card';c.id='s'+(i+1);
 c.innerHTML=`<div class="top"><span class="no">Soal ${i+1}</span><span class="tag">${s.t}</span></div>${s.q}
 <div class="hint" id="h${i}"><b>Petunjuk:</b> ${s.h}</div>
 <div class="act"><button data-h="${i}">Lihat petunjuk</button><label><input type="checkbox" data-d="${i}"> Tandai selesai</label></div>`;
 L.appendChild(c);
});
function upd(){
 const n=Object.values(done).filter(Boolean).length;
 pb.style.width=n*10+'%';pt.textContent=n+' dari 10 soal selesai';
 S.forEach((_,i)=>{const c=document.getElementById('s'+(i+1));c.classList.toggle('done',!!done[i]);c.querySelector('[data-d]').checked=!!done[i]});
}
function save(){try{localStorage.setItem('hotsgs',JSON.stringify(done))}catch(e){}}
L.addEventListener('click',e=>{
 const b=e.target.closest('[data-h]');if(b)document.getElementById('h'+b.dataset.h).classList.toggle('show');
});
L.addEventListener('change',e=>{
 const d=e.target.dataset.d;if(d!==undefined){done[d]=e.target.checked;save();upd()}
});
let all=false;
document.getElementById('th').onclick=function(){all=!all;document.querySelectorAll('.hint').forEach(h=>h.classList.toggle('show',all));this.textContent=all?'Sembunyikan semua petunjuk':'Tampilkan semua petunjuk'};
document.getElementById('rs').onclick=()=>{done={};save();upd();document.querySelectorAll('.hint').forEach(h=>h.classList.remove('show'))};
document.getElementById('dk').onclick=()=>{const r=document.documentElement;const dark=getComputedStyle(r).getPropertyValue('--bg').trim()==='#141a22';r.setAttribute('data-theme',dark?'light':'dark')};
upd();
</script>
</body>
</html>
